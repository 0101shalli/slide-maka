databases:
  - name: slide-maka-db
    databaseName: slide_maka
    user: slide_maka
    plan: free
    region: oregon

services:
  - type: web
    name: slide-maka-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slide-maka-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_DIR
        value: generated

  - type: web
    name: slide-maka-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Keep this in step with the backend service name above.
      - key: VITE_API_BASE_URL
        value: https://slide-maka-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
