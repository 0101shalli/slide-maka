databases:
  - name: slide-maka-db
    databaseName: slide_maka
    user: slide_maka
    plan: free
    region: oregon

services:
  - type: web
    name: slide-maka-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slide-maka-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: GEMINI_SLIDES_CACHE_TTL
        value: "1800"
      - key: ENABLE_DETAILED_AI_CONTENT
        value: "false"
      - key: ENABLE_AI_VISUAL_PLANNER
        value: "true"
      - key: IMAGE_PREFETCH_WORKERS
        value: "6"
      - key: ENABLE_LEGACY_UNSPLASH
        value: "false"
      - key: SLIDEMAKA_SSL_VERIFY
        value: "1"
      - key: STORAGE_DIR
        value: /app/generated

  - type: web
    name: slide-maka-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Keep this in step with the backend service name above.
      - key: VITE_API_BASE_URL
        value: https://slide-maka-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
