[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidemaka-backend"
version = "0.1.0"
description = "SlideMaka FastAPI backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.2",
  "uvicorn==0.30.6",
  "sqlalchemy==2.0.35",
  "psycopg2-binary==2.9.9",
  "pydantic==2.9.2",
  "python-pptx==0.6.23",
  "python-multipart==0.0.12"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
